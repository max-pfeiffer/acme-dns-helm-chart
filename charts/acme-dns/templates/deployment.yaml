{{- include "acme-dns.validateValues" . }}
{{- if eq .Values.database.engine "postgres" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  # Distinct from the StatefulSet name on purpose, see acme-dns.deploymentName.
  name: {{ include "acme-dns.deploymentName" . }}
  labels:
    {{- include "acme-dns.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    type: {{ .type }}
    {{- if eq .type "RollingUpdate" }}
    {{- with .rollingUpdate }}
    rollingUpdate:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- end }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "acme-dns.selectorLabels" . | nindent 6 }}
  template:
    {{- include "acme-dns.podTemplate" . | nindent 4 }}
{{- end }}
