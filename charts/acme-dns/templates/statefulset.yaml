{{- include "acme-dns.validateValues" . }}
{{- if eq .Values.database.engine "sqlite" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  # Distinct from the Deployment name on purpose, see acme-dns.statefulSetName.
  name: {{ include "acme-dns.statefulSetName" . }}
  labels:
    {{- include "acme-dns.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "acme-dns.fullname" . }}
  # acme-dns keeps its state in a single SQLite file on the volumeClaimTemplate
  # below, which cannot be shared between pods. Enforced by validateValues.
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "acme-dns.selectorLabels" . | nindent 6 }}
  template:
    {{- include "acme-dns.podTemplate" . | nindent 4 }}
  # Everything in a StatefulSet spec except replicas, template, updateStrategy,
  # minReadySeconds and persistentVolumeClaimRetentionPolicy is immutable, so
  # sqliteVolumeSize and sqliteStorageClass cannot be changed on an existing
  # release: the upgrade fails with a Forbidden error. Resize the PVC itself
  # instead (if the StorageClass allows it), or delete the StatefulSet with
  # --cascade=orphan and reinstall.
  volumeClaimTemplates:
  - metadata:
      name: sqlite
    spec:
      accessModes:
        - "ReadWriteOnce"
      {{- if .Values.sqliteStorageClass }}
      storageClassName: {{ if eq .Values.sqliteStorageClass "-" }}""{{ else }}{{ .Values.sqliteStorageClass | quote }}{{ end }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.sqliteVolumeSize }}
{{- end }}
