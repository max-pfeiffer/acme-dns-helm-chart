# Default values for acme-dns.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: joohoi/acme-dns
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

database:
  # Which database engine the `config` blob at the bottom of this file is set up
  # to use. This must match [database].engine in `config`: the chart does not
  # parse that blob, it uses this value to pick its topology.
  #
  #   sqlite   -> StatefulSet with a per-pod PersistentVolumeClaim holding the
  #               database file. replicaCount must be 1.
  #   postgres -> Deployment, no PersistentVolumeClaim. replicaCount may be > 1;
  #               all replicas share the one PostgreSQL database.
  #
  # Note that acme-dns v2.x names the SQLite engine "sqlite", not "sqlite3".
  engine: sqlite

# Number of acme-dns replicas. Only values > 1 with database.engine = "postgres"
# are supported; see the notes printed after installation before scaling up.
replicaCount: 1

# Rollout strategy for the Deployment (database.engine = "postgres" only). The
# default keeps every replica serving during a rollout, which matters because
# these pods answer DNS queries for in-flight ACME challenges.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials? acme-dns never calls
  # the Kubernetes API, so this is disabled by default.
  automount: false
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL
    # NET_BIND_SERVICE is required to bind the DNS listener to port 53 (a
    # privileged port) without running the container as root. The upstream
    # joohoi/acme-dns image has no USER directive and runs as root by default.
    add:
      - NET_BIND_SERVICE

services:
  api:
    type: LoadBalancer
    # Default is plain HTTP on port 80, matching the default `tls = "none"`
    # config below. This is the documented pattern for running acme-dns
    # alongside cert-manager in the same cluster (TLS terminated elsewhere,
    # e.g. by an Ingress/HTTPRoute or because the API is only reached
    # in-cluster). Set this to 443 and switch `tls` to "letsencrypt",
    # "letsencryptstaging" or "cert" if the API should terminate TLS itself.
    ports:
      api: 80
    metadata:
      labels: {}
      annotations: {}
  dns:
    type: LoadBalancer
    ports:
      dnsTcp: 53
      dnsUdp: 53
    metadata:
      labels: {}
      annotations: {}

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: api
readinessProbe:
  httpGet:
    path: /health
    port: api

nodeSelector: {}

tolerations: []

affinity: {}

# Size of the per-pod PersistentVolumeClaim holding the SQLite database file.
# Unused when database.engine = "postgres".
sqliteVolumeSize: 100M

# See: https://github.com/acme-dns/acme-dns
config: |
  [general]
  # DNS interface. Note that systemd-resolved may reserve port 53 on 127.0.0.53
  # In this case acme-dns will error out and you will need to define the listening interface
  # for example: listen = "127.0.0.1:53"
  listen = "0.0.0.0:53"
  # protocol, "both", "both4", "both6", "udp", "udp4", "udp6" or "tcp", "tcp4", "tcp6"
  protocol = "both"
  # domain name to serve the requests off of
  domain = "auth.example.org"
  # zone name server
  nsname = "auth.example.org"
  # admin email address, where @ is substituted with .
  nsadmin = "admin.example.org"
  # predefined records served in addition to the TXT
  records = [
      # domain pointing to the public IP of your acme-dns server 
      "auth.example.org. A 198.51.100.1",
      # specify that auth.example.org will resolve any *.auth.example.org records
      "auth.example.org. NS auth.example.org.",
  ]
  # debug messages from CORS etc
  debug = false

  [database]
  # Database engine to use, sqlite or postgres. Keep this in sync with the
  # database.engine value above. acme-dns v2.x rejects the old "sqlite3" name.
  engine = "sqlite"
  # Connection string, filename for sqlite and postgres://$username:$password@$host/$db_name for postgres
  # Please note that the default Docker image uses path /var/lib/acme-dns/acme-dns.db for sqlite
  connection = "/var/lib/acme-dns/acme-dns.db"
  # connection = "postgres://user:password@postgresql/acmedns_db?sslmode=require"

  [api]
  # listen ip eg. 127.0.0.1
  ip = "0.0.0.0"
  # disable registration endpoint
  disable_registration = false
  # listen port, eg. 443 for default HTTPS
  port = "80"
  # possible values: "letsencrypt", "letsencryptstaging", "cert", "none"
  tls = "none"
  # only used if tls = "cert"
  tls_cert_privkey = "/etc/tls/example.org/privkey.pem"
  tls_cert_fullchain = "/etc/tls/example.org/fullchain.pem"
  # only used if tls = "letsencrypt"
  acme_cache_dir = "api-certs"
  # optional e-mail address to which Let's Encrypt will send expiration notices for the API's cert
  notification_email = ""
  # CORS AllowOrigins, wildcards can be used
  corsorigins = [
      "*"
  ]
  # use HTTP header to get the client ip
  use_header = false
  # header name to pull the ip address / list of ip addresses from
  header_name = "X-Forwarded-For"

  [logconfig]
  # logging level: "error", "warning", "info" or "debug"
  loglevel = "debug"
  # possible values: stdout, TODO file & integrations
  logtype = "stdout"
  # file path for logfile TODO
  # logfile = "./acme-dns.log"
  # format, either "json" or "text"
  logformat = "text"